name: Fuzz

# Fuzzing is slow and its findings are non-deterministic, so it runs on a
# schedule rather than on every pull request. The seed corpus still runs as a
# normal unit test in CI, which catches the obvious regressions immediately.
on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays, 04:17 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: How long to fuzz each target
        default: 5m

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Fuzz the transcript parser
        run: |
          DURATION="${{ github.event.inputs.duration || '5m' }}"
          go test ./internal/transcript/ -run FuzzParse -fuzz FuzzParse -fuzztime "$DURATION"

      # A crashing input is written to testdata/fuzz; keep it so the failure can
      # be reproduced and turned into a regression test.
      - name: Save any failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure
          path: internal/transcript/testdata/fuzz/
