name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true

      # The restore tests build real local git repositories and clone from them,
      # so git needs an identity to commit with.
      - name: Configure git
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      - run: go build ./...
      - run: go test ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true
      - name: Configure git
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      # A capture hook and the reconcile timer write the same SQLite file from
      # separate processes; TestConcurrentCaptureAndScan is what makes this
      # meaningful rather than a formality.
      - run: go test -race ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true
      - name: Configure git
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      # scripts/coverage.sh does two things a plain `go test -cover` does not:
      # attributes coverage across packages, and collects it from the binary the
      # CLI tests run as a subprocess. Without both, the figure understates
      # reality by roughly 24 points.
      - name: Measure
        run: |
          {
            echo '### Coverage'
            echo
            echo '```'
            ./scripts/coverage.sh coverage.out | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      # Checks the dependency tree against the Go vulnerability database, and
      # reports only vulnerabilities actually reachable from this code.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The linters run against the project rather than being part of it, so
      # they get the current stable toolchain. The build and test jobs keep the
      # minimum version go.mod claims, so CI proves that claim every run.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # Pinned, not @latest: an unpinned tool can break CI without any change
      # here. staticcheck 0.8.x needs a newer Go than the version the test jobs
      # pin, which is why this job uses the current stable toolchain instead.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$(go env GOPATH)/bin/staticcheck" ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true
      - name: Build for every supported platform
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/ccvault
          done
